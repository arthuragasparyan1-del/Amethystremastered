
name: Xcode - Build Amethyst

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Amethyst
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Make
        run: |
          brew install make
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(brew --prefix make)/bin/gmake" /usr/local/bin/gmake
          gmake --version

      - name: Install JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/javac"

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Amethyst.xcodeproj

      - name: Build Amethyst
        run: |
          export BOOTJDK="$JAVA_HOME"

          set -o pipefail

          xcodebuild clean build \
            -project Amethyst.xcodeproj \
            -scheme "Angel Aura Amethyst" \
            -configuration Release
