
name: Xcode - Build Amethyst

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Amethyst
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU Make
        run: |
          brew install make
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(brew --prefix make)/bin/gmake" /usr/local/bin/gmake
          gmake --version

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Amethyst.xcodeproj

      - name: Build Amethyst
        run: |
          set -o pipefail

          xcodebuild clean build \
            -project Amethyst.xcodeproj \
            -scheme "Angel Aura Amethyst" \
            -configuration Release
