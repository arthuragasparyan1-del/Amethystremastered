
name: Xcode - Build Amethyst

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Amethyst and IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Make
        run: |
          brew install make
          echo "$(brew --prefix make)/bin" >> "$GITHUB_PATH"
          gmake --version

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Install JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Verify JDK 8
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version
          test -x "$JAVA_HOME/bin/javac"

      - name: Install ldid
        run: |
          brew install ldid
          ldid -h || true

      - name: Install build dependencies
        run: |
          brew install cmake

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Amethyst.xcodeproj

      - name: Build Amethyst with Xcode
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Amethyst.xcodeproj \
            -scheme "Angel Aura Amethyst" \
            -configuration Release \
            "BOOTJDK=$JAVA_HOME/bin"

      - name: Build iOS IPA
        run: |
          set -e
          gmake dsym package \
            PLATFORM=2 \
            BOOTJDK="$JAVA_HOME/bin" \
            RUNNER=1

      - name: Verify IPA
        run: |
          ls -lah artifacts/
          IPA=$(find artifacts -maxdepth 1 -type f \
            -name 'org.angelauramc.amethyst-*-ios.ipa' \
            -print -quit)
          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi
          echo "Found IPA: $IPA"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Better-Launcher-iOS-IPA
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error
          retention-days: 7
