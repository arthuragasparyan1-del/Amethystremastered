
name: Xcode - Build Better Launcher

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Better Launcher IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Make
        run: |
          brew install make
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(brew --prefix make)/bin/gmake" /usr/local/bin/gmake
          sudo chmod +x /usr/local/bin/gmake
          /usr/local/bin/gmake --version

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Install JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Verify JDK 8
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version
          test -x "$JAVA_HOME/bin/javac"

      - name: Install ldid
        run: |
          brew install ldid
          ldid -h || true

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Amethyst.xcodeproj
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build and package iOS app
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:$(brew --prefix make)/bin:$PATH"

          test -x /usr/local/bin/gmake

          xcodebuild clean build \
            -project Amethyst.xcodeproj \
            -scheme "Angel Aura Amethyst" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            "BOOTJDK=$JAVA_HOME/bin"

      - name: Verify IPA
        run: |
          echo "Searching for IPA files..."
          find . -type f -name "*.ipa" -print

          IPA="$(find artifacts -maxdepth 1 -type f -name 'org.angelauramc.amethyst-*-ios.ipa' -print -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was created."
            echo "The Xcode build alone did not produce the packaged IPA."
            exit 1
          fi

          echo "Found IPA: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Better-Launcher-iOS-IPA
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error
          retention-days: 14
